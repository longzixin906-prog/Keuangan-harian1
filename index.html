<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Keuangan Harian</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:22px 18px;border-radius:0 0 22px 22px}
h1{margin:0 0 5px;font-size:25px}.muted{opacity:.7;font-size:13px}
main{padding:16px;max-width:650px;margin:auto}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #00000010}
.balance{font-size:30px;font-weight:700;margin-top:6px}.row{display:flex;gap:10px}.row>*{flex:1}
input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #d1d5db;font-size:15px}
button{border:0;background:#111827;color:white;font-weight:700;cursor:pointer;margin-top:8px}
button.secondary{background:#e5e7eb;color:#111827}.status{font-weight:800;font-size:19px;padding:12px;border-radius:12px;text-align:center}
.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
.tx{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.tx:last-child{border:0}
.small{font-size:12px;color:#6b7280}.plus{color:#15803d}.minus{color:#b91c1c}
</style>
</head>
<body>
<header><h1>💰 Keuangan Harian</h1><div class="muted">Catat uang masuk & keluar tanpa ribet.</div></header>
<main>
<div class="card"><div class="small">SALDO</div><div id="balance" class="balance">Rp0</div></div>

<div class="card">
<h3>Pemasukan</h3>
<div class="row"><input id="income" type="number" placeholder="Nominal"><input id="incomeNote" placeholder="Keterangan"></div>
<button onclick="addIncome()">Tambah Pemasukan</button>
</div>

<div class="card">
<h3>Pengeluaran</h3>
<div class="row"><input id="expense" type="number" placeholder="Nominal"><input id="expenseNote" placeholder="Beli apa?"></div>
<div class="row"><select id="category"><option>Makan</option><option>Transportasi</option><option>Game</option><option>Rokok</option><option>Belanja</option><option>Lainnya</option></select><input id="dailyLimit" type="number" placeholder="Batas harian"></div>
<button onclick="addExpense()">Tambah Pengeluaran</button>
</div>

<div class="card">
<h3>Status hari ini</h3><div id="status" class="status good">🟢 BAIK — Tidak Boros</div>
<p id="advice" class="small"></p>
</div>

<div class="card">
<h3>Riwayat</h3><div id="history"></div>
<button class="secondary" onclick="clearAll()">Hapus Semua Data</button>
</div>
</main>
<script>
const key="keuangan_v1";
let data=JSON.parse(localStorage.getItem(key)||'{"tx":[]}');
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
function save(){localStorage.setItem(key,JSON.stringify(data));render()}
function addIncome(){let n=+income.value;if(!n)return;data.tx.push({type:"in",n,note:incomeNote.value||"Pemasukan",date:new Date().toISOString()});income.value="";incomeNote.value="";save()}
function addExpense(){let n=+expense.value;if(!n)return;data.tx.push({type:"out",n,note:expenseNote.value||"Pengeluaran",cat:category.value,date:new Date().toISOString()});expense.value="";expenseNote.value="";save()}
function render(){
 let bal=data.tx.reduce((s,t)=>s+(t.type==="in"?t.n:-t.n),0);balance.textContent=rp(bal);
 let today=new Date().toDateString(), spent=data.tx.filter(t=>t.type==="out"&&new Date(t.date).toDateString()===today).reduce((s,t)=>s+t.n,0);
 let limit=+dailyLimit.value||0, bad=limit>0&&spent>limit;
 status.className="status "+(bad?"bad":"good");status.textContent=bad?"🔴 BOROS":"🟢 BAIK — Tidak Boros";
 advice.textContent=limit?`Pengeluaran hari ini: ${rp(spent)} dari batas ${rp(limit)}.`:"Isi batas pengeluaran harian untuk mendapatkan penilaian otomatis.";
 history.innerHTML=data.tx.slice().reverse().map((t,i)=>`<div class="tx"><div><b>${t.note}</b><div class="small">${t.cat||"Pemasukan"} • ${new Date(t.date).toLocaleDateString("id-ID")}</div></div><b class="${t.type==="in"?"plus":"minus"}">${t.type==="in"?"+":"-"}${rp(t.n)}</b></div>`).join("")||'<div class="small">Belum ada transaksi.</div>';
}
dailyLimit.addEventListener("input",()=>{localStorage.setItem("daily_limit",dailyLimit.value);render()});
dailyLimit.value=localStorage.getItem("daily_limit")||"";
function clearAll(){if(confirm("Hapus semua transaksi?")){data.tx=[];save()}}
render();
</script>
</body></html>
